<!DOCTYPE html>
<html>
<head>
    <title>VexFlow Score</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            /* Hide scrollbar for IE, Edge and Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        #canvas-container::-webkit-scrollbar {
            display: none;
        }
        #score-wrapper {
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            padding-left: 20px;
            display: inline-block;
        }
        #output {
            /* position: relative; */
        }
        .cursor {
            display: none !important;
        }
        
        @keyframes humo {
            0% {
                transform: rotate(0deg) translateY(0);
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                transform: rotate(45deg) translateY(-50px); /* Adjusted for SVG scale */
                opacity: 0;
                filter: blur(4px); /* Reduced blur for performance */
            }
        }
        
        .smoke-effect {
            animation: humo 1s linear forwards;
            transform-box: fill-box;
            transform-origin: center;
        }
    </style>
    <!-- Load VexFlow from local file -->
    <script src="vexflow.js"></script>
</head>
<body>
    <div id="canvas-container">
        <div id="score-wrapper">
            <div id="output"></div>
            <div id="cursor" class="cursor"></div>
        </div>
    </div>
    <div id="countdown-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; color: white; font-size: 100px; font-family: sans-serif;">
        3
    </div>

    <script>
        // Wait for VexFlow to load
        window.addEventListener('load', () => {
            if (typeof Vex === 'undefined') {
                console.error("VexFlow library not loaded!");
                document.getElementById("output").innerHTML = "Error: VexFlow library not loaded.";
                return;
            }

            const { Renderer, Stave, StaveNote, Voice, Formatter, Beam, StaveConnector, BarNote, GhostNote } = Vex.Flow;

            let renderer, context;
            let currentNotes = [];
            let indexToNoteMap = {}; // Map original index to {note, keyIndex}
            let staveTreble, staveBass;
            let noteDataMap = []; // Stores metadata like start_time for each note
            let activeNoteIndices = []; // Track currently highlighted notes (cursor replacement)
            let lastNotesData = null;
            let lastTempo = 120;
            let beamsList = []; // Store beam info for visual effects
            
            // Initialize VexFlow
            function initVexFlow() {
                const div = document.getElementById("output");
                div.innerHTML = ""; // Clear previous
                beamsList = []; // Clear beams list
                
                renderer = new Renderer(div, Renderer.Backends.SVG);
                
                // Configure size
                renderer.resize(1200, 500);
                context = renderer.getContext();
            }

            // Render a simple score (Test function)
            function renderSample() {
                initVexFlow();
                
                // Create Grand Staff
                staveTreble = new Stave(20, 40, 1000); // Increased x to 20
                staveTreble.addClef("treble").addTimeSignature("4/4");
                staveTreble.setContext(context).draw();
                
                staveBass = new Stave(20, 150, 1000); // Increased x to 20
                staveBass.addClef("bass").addTimeSignature("4/4");
                staveBass.setContext(context).draw();
                
                new StaveConnector(staveTreble, staveBass).setType(StaveConnector.type.BRACE).setContext(context).draw();
                new StaveConnector(staveTreble, staveBass).setType(StaveConnector.type.SINGLE_LEFT).setContext(context).draw();
                new StaveConnector(staveTreble, staveBass).setType(StaveConnector.type.SINGLE_RIGHT).setContext(context).draw();

                const notes = [
                    new StaveNote({ keys: ["c/4"], duration: "q" }),
                    new StaveNote({ keys: ["d/4"], duration: "q" }),
                    new StaveNote({ keys: ["b/4"], duration: "qr" }),
                    new StaveNote({ keys: ["c/4", "e/4", "g/4"], duration: "q" })
                ];

                const voice = new Voice({num_beats: 4,  beat_value: 4});
                voice.addTickables(notes);

                new Formatter().joinVoices([voice]).format([voice], 900);

                voice.draw(context, staveTreble);
                currentNotes = notes;
            }

            // Function called from Python to render notes
            // notesData: Array of {keys: ["c/4"], duration: "q", color: "black", pitch: 60, start_time: 0.0}
            window.renderNotes = function(notesData, tempo) {
                lastNotesData = notesData;
                lastTempo = tempo;
                render();
            }

            function render() {
                if (!lastNotesData) return;
                if (viewMode === 'wrapped') {
                    renderWrapped(lastNotesData, lastTempo);
                } else {
                    renderLinear(lastNotesData, lastTempo);
                }
            }

            function renderLinear(notesData, tempo) {
                initVexFlow();
                noteDataMap = notesData.map(n => ({...n, baseColor: n.color || 'black'})); 
                indexToNoteMap = {};
                activeNoteIndices = [];
                console.log("Rendering Linear with tempo:", tempo);
                
                // Group notes by start_time to form chords
                const groups = {};
                noteDataMap.forEach((n, i) => {
                    const time = n.start_time.toFixed(3); // Round to avoid float errors
                    if (!groups[time]) groups[time] = [];
                    groups[time].push({ ...n, originalIndex: i });
                });
                
                // Sort groups by time
                const sortedTimes = Object.keys(groups).sort((a, b) => parseFloat(a) - parseFloat(b));
                
                const notes = [];
                const bassNotes = [];
                let currentBeats = 0;
                
                sortedTimes.forEach(time => {
                    const group = groups[time];
                    
                    // Sort group by pitch to ensure keys are sorted for VexFlow
                    group.sort((a, b) => a.pitch - b.pitch);

                    // Use properties of the first note in group
                    const first = group[0];
                    
                    // Deduplicate keys to avoid double noteheads
                    const uniqueKeys = [];
                    const seenKeys = new Map(); // keyString -> keyIndex
                    
                    group.forEach(n => {
                        const key = n.keys[0];
                        if (!seenKeys.has(key)) {
                            seenKeys.set(key, uniqueKeys.length);
                            uniqueKeys.push(key);
                        }
                    });
                    
                    if (uniqueKeys.length === 0) return;

                    const note = new StaveNote({ 
                        keys: uniqueKeys, 
                        duration: first.duration,
                        auto_stem: true,
                        clef: "treble"
                    });
                    
                    // Map original indices to this note
                    const myIndices = [];
                    group.forEach(n => {
                        const keyIdx = seenKeys.get(n.keys[0]);
                        indexToNoteMap[n.originalIndex] = { note: note, keyIndex: keyIdx };
                        myIndices.push(n.originalIndex);
                        
                        if (n.color) {
                            note.setKeyStyle(keyIdx, {fillStyle: n.color, strokeStyle: n.color});
                        }
                    });
                    note.myIndices = myIndices;
                    
                    notes.push(note);
                    
                    // Add matching GhostNote to bass to keep alignment
                    bassNotes.push(new GhostNote({ keys: ["c/3"], duration: first.duration }));
                    
                    // Calculate beats
                    const durationMap = {
                        "w": 4, "h": 2, "q": 1, "8": 0.5, "16": 0.25, "32": 0.125,
                        "wr": 4, "hr": 2, "qr": 1, "8r": 0.5, "16r": 0.25, "32r": 0.125
                    };
                    let beats = durationMap[first.duration] || 1;
                    if (first.duration.includes("d")) beats *= 1.5;
                    
                    currentBeats += beats;
                    
                    // Add Bar Line if we crossed a measure boundary (4 beats)
                    while (currentBeats >= 4) {
                        notes.push(new BarNote());
                        bassNotes.push(new BarNote());
                        currentBeats -= 4;
                    }
                });

                // Calculate required width
                const width = Math.max(1000, notes.length * 50); 
                renderer.resize(width + 50, 500);
                
                // Create Grand Staff
                staveTreble = new Stave(20, 40, width);
                staveTreble.addClef("treble").addTimeSignature("4/4");
                staveTreble.setContext(context).draw();
                
                staveBass = new Stave(20, 160, width);
                staveBass.addClef("bass").addTimeSignature("4/4");
                staveBass.setContext(context).draw();
                
                new StaveConnector(staveTreble, staveBass).setType(StaveConnector.type.BRACE).setContext(context).draw();
                new StaveConnector(staveTreble, staveBass).setType(StaveConnector.type.SINGLE_LEFT).setContext(context).draw();
                new StaveConnector(staveTreble, staveBass).setType(StaveConnector.type.SINGLE_RIGHT).setContext(context).draw();

                // Create beams automatically
                const staveNotesOnly = notes.filter(n => n instanceof StaveNote);
                const beams = Beam.generateBeams(staveNotesOnly);

                const voice = new Voice({num_beats: notes.length, beat_value: 4}); 
                voice.setStrict(false); 
                voice.addTickables(notes);

                const bassVoice = new Voice({num_beats: bassNotes.length, beat_value: 4});
                bassVoice.setStrict(false);
                bassVoice.addTickables(bassNotes);

                new Formatter().joinVoices([voice, bassVoice]).format([voice, bassVoice], width - 50);

                voice.draw(context, staveTreble);
                bassVoice.draw(context, staveBass);
                
                beams.forEach((b, i) => {
                    context.openGroup("vf-beam-" + i);
                    b.setContext(context).draw();
                    context.closeGroup();
                    
                    const beamIndices = [];
                    b.notes.forEach(n => {
                        if (n.myIndices) beamIndices.push(...n.myIndices);
                    });
                    beamsList.push({
                        className: "vf-beam-" + i,
                        noteIndices: beamIndices
                    });
                });
                
                currentNotes = notes;
            }

            function renderWrapped(notesData, tempo) {
                initVexFlow();
                noteDataMap = notesData.map(n => ({...n, baseColor: n.color || 'black'})); 
                indexToNoteMap = {};
                activeNoteIndices = [];
                console.log("Rendering Wrapped with tempo:", tempo);
                
                // --- 1. PREPARE DATA (Same as renderLinear) ---
                const groups = {};
                noteDataMap.forEach((n, i) => {
                    const time = n.start_time.toFixed(3);
                    if (!groups[time]) groups[time] = [];
                    groups[time].push({ ...n, originalIndex: i });
                });
                
                const sortedTimes = Object.keys(groups).sort((a, b) => parseFloat(a) - parseFloat(b));
                
                const allData = []; // Linear list of {type: 'note'|'bar', ...}
                let currentBeats = 0;
                
                sortedTimes.forEach(time => {
                    const group = groups[time];
                    group.sort((a, b) => a.pitch - b.pitch);
                    
                    const first = group[0];
                    
                    // Deduplicate keys
                    const uniqueKeys = [];
                    const keyMappings = []; // { originalIndex, keyIndex, color }
                    const seenKeys = new Map(); // keyString -> keyIndex

                    group.forEach(n => {
                        const key = n.keys[0];
                        let keyIndex;
                        if (seenKeys.has(key)) {
                            keyIndex = seenKeys.get(key);
                        } else {
                            keyIndex = uniqueKeys.length;
                            uniqueKeys.push(key);
                            seenKeys.set(key, keyIndex);
                        }
                        keyMappings.push({
                            originalIndex: n.originalIndex,
                            keyIndex: keyIndex,
                            color: n.color
                        });
                    });

                    if (uniqueKeys.length === 0) return;

                    allData.push({
                        type: 'note',
                        keys: uniqueKeys,
                        duration: first.duration,
                        mappings: keyMappings
                    });
                    
                    const durationMap = {
                        "w": 4, "h": 2, "q": 1, "8": 0.5, "16": 0.25, "32": 0.125,
                        "wr": 4, "hr": 2, "qr": 1, "8r": 0.5, "16r": 0.25, "32r": 0.125
                    };
                    let beats = durationMap[first.duration] || 1;
                    if (first.duration.includes("d")) beats *= 1.5;
                    
                    currentBeats += beats;
                    
                    while (currentBeats >= 4) {
                        allData.push({ type: 'bar' });
                        currentBeats -= 4;
                    }
                });
                
                // --- 2. CHUNK INTO MEASURES ---
                const measures = [];
                let currentMeasure = [];
                
                allData.forEach(d => {
                    if (d.type === 'bar') {
                        // End of measure
                        // We include the bar in the measure so it draws the line
                        currentMeasure.push(d);
                        measures.push(currentMeasure);
                        currentMeasure = [];
                    } else {
                        currentMeasure.push(d);
                    }
                });
                if (currentMeasure.length > 0) measures.push(currentMeasure);
                
                // --- 3. CALCULATE WIDTHS ---
                // Helper to create voice from data
                const createVoice = (data) => {
                    const notes = data.map(d => {
                        if (d.type === 'bar') return new BarNote();
                        return new StaveNote({ 
                            keys: d.keys, 
                            duration: d.duration,
                            auto_stem: true,
                            clef: "treble"
                        });
                    });
                    const v = new Voice({num_beats: 4, beat_value: 4});
                    v.setStrict(false);
                    v.addTickables(notes);
                    return v;
                };

                const measureWidths = measures.map(m => {
                    const v = createVoice(m);
                    const formatter = new Formatter();
                    return formatter.joinVoices([v]).preCalculateMinTotalWidth([v]) + 30; // +Padding
                });
                
                // --- 4. LAYOUT SYSTEMS ---
                const outputDiv = document.getElementById("output");
                const a4WidthPx = outputDiv.clientWidth || 790; 
                const availableWidth = a4WidthPx - 40; 
                const systemStartPadding = 60; // Clef/TimeSig space
                
                const systems = [];
                let currentSystem = [];
                let currentSystemWidth = 0;
                
                measures.forEach((m, i) => {
                    const minWidth = measureWidths[i];
                    const isFirst = currentSystem.length === 0;
                    const required = minWidth + (isFirst ? systemStartPadding : 0);
                    
                    if (currentSystemWidth + required > availableWidth && currentSystem.length > 0) {
                        systems.push(currentSystem);
                        currentSystem = [];
                        currentSystemWidth = 0;
                    }
                    
                    currentSystem.push({ data: m, minWidth: minWidth });
                    currentSystemWidth += minWidth + (currentSystem.length === 1 ? systemStartPadding : 0);
                });
                if (currentSystem.length > 0) systems.push(currentSystem);
                
                // --- 5. RENDER ---
                const container = document.getElementById("canvas-container");
                container.style.overflowX = "hidden";
                container.style.overflowY = "auto";
                
                let y = 40;
                renderer.resize(a4WidthPx, Math.max(2000, y + (systems.length * 260) + 100));
                
                systems.forEach((system, sysIdx) => {
                    let x = 20;
                    // Distribute extra space
                    const sysMinWidth = system.reduce((sum, m, i) => sum + m.minWidth + (i===0 ? systemStartPadding : 0), 0);
                    const extra = Math.max(0, availableWidth - sysMinWidth);
                    const extraPerMeasure = extra / system.length;
                    
                    system.forEach((m, i) => {
                        const isFirst = i === 0;
                        const width = m.minWidth + (isFirst ? systemStartPadding : 0) + extraPerMeasure;
                        
                        // Treble Stave
                        const staveTreble = new Stave(x, y, width);
                        if (isFirst) {
                            staveTreble.addClef("treble").addTimeSignature("4/4");
                        }
                        staveTreble.setContext(context).draw();
                        
                        // Bass Stave
                        const staveBass = new Stave(x, y + 110, width);
                        if (isFirst) {
                            staveBass.addClef("bass").addTimeSignature("4/4");
                        }
                        staveBass.setContext(context).draw();
                        
                        // Connectors
                        if (isFirst) {
                            new StaveConnector(staveTreble, staveBass).setType(StaveConnector.type.BRACE).setContext(context).draw();
                            new StaveConnector(staveTreble, staveBass).setType(StaveConnector.type.SINGLE_LEFT).setContext(context).draw();
                        }
                        new StaveConnector(staveTreble, staveBass).setType(StaveConnector.type.SINGLE_RIGHT).setContext(context).draw();

                        // Voices
                        const trebleNotes = [];
                        const bassNotes = [];
                        
                        m.data.forEach(d => {
                            if (d.type === 'bar') {
                                trebleNotes.push(new BarNote());
                                bassNotes.push(new BarNote());
                            } else {
                                const note = new StaveNote({ 
                                    keys: d.keys, 
                                    duration: d.duration,
                                    auto_stem: true,
                                    clef: "treble"
                                });
                                
                                if (d.mappings) {
                                    const myIndices = [];
                                    d.mappings.forEach(mapping => {
                                        indexToNoteMap[mapping.originalIndex] = { note: note, keyIndex: mapping.keyIndex };
                                        myIndices.push(mapping.originalIndex);
                                        if (mapping.color) {
                                            note.setKeyStyle(mapping.keyIndex, {fillStyle: mapping.color, strokeStyle: mapping.color});
                                        }
                                    });
                                    note.myIndices = myIndices;
                                } else if (d.indices) {
                                    // Fallback for legacy data structure if any
                                    note.myIndices = d.indices;
                                    d.indices.forEach((oidx, kIdx) => {
                                        indexToNoteMap[oidx] = { note: note, keyIndex: kIdx };
                                        if (d.colors && d.colors[kIdx]) {
                                            note.setKeyStyle(kIdx, {fillStyle: d.colors[kIdx], strokeStyle: d.colors[kIdx]});
                                        }
                                    });
                                }

                                trebleNotes.push(note);
                                bassNotes.push(new GhostNote({ keys: ["c/3"], duration: d.duration }));
                            }
                        });
                        
                        const voice = new Voice({num_beats: 4, beat_value: 4});
                        voice.setStrict(false);
                        voice.addTickables(trebleNotes);
                        
                        const bassVoice = new Voice({num_beats: 4, beat_value: 4});
                        bassVoice.setStrict(false);
                        bassVoice.addTickables(bassNotes);
                        
                        new Formatter().joinVoices([voice, bassVoice]).format([voice, bassVoice], width - (isFirst ? systemStartPadding : 10));
                        
                        // Generate beams BEFORE drawing voice so flags are hidden
                        const staveNotesOnly = trebleNotes.filter(n => n instanceof StaveNote);
                        const beams = Beam.generateBeams(staveNotesOnly);
                        
                        voice.draw(context, staveTreble);
                        bassVoice.draw(context, staveBass);
                        
                        beams.forEach((b, beamIdx) => {
                            // Unique class name per system/measure/beam
                            const beamClass = "vf-beam-" + sysIdx + "-" + i + "-" + beamIdx;
                            context.openGroup(beamClass);
                            b.setContext(context).draw();
                            context.closeGroup();
                            
                            const beamIndices = [];
                            b.notes.forEach(n => {
                                if (n.myIndices) beamIndices.push(...n.myIndices);
                            });
                            beamsList.push({
                                className: beamClass,
                                noteIndices: beamIndices
                            });
                        });
                        
                        x += width;
                    });
                    y += 260;
                });
                
                renderer.resize(a4WidthPx, y + 100);
            }

            // Highlight a specific note by index (called from Python for feedback)
            window.highlightNote = function(index, color) {
                if (noteDataMap[index]) {
                    noteDataMap[index].baseColor = color; // Update base color state
                    
                    // If the note is currently in 'future' state, apply the color immediately.
                    // If it's 'active' or 'past', the loop will handle it (or we might want to override).
                    // Usually feedback comes when note is active or just finished.
                    // If we hit a note correctly, it might be 'active' or 'past'.
                    // Let's force update if it's not 'active' (orange).
                    
                    const currentState = noteDataMap[index].currentState;
                    if (currentState !== 'active') {
                         _applyColorToNote(index, color);
                    }
                }
            }
            
            function _applyColorToNote(index, color) {
                if (indexToNoteMap[index]) {
                    const { note, keyIndex } = indexToNoteMap[index];
                    // note.setKeyStyle(keyIndex, {fillStyle: color, strokeStyle: color});
                    // VexFlow setKeyStyle might not update after draw?
                    // Let's try direct DOM manipulation which is faster/reliable for already drawn notes
                    
                    const group = note.getAttribute("el"); 
                    if(group) {
                        // This is tricky for chords. VexFlow groups all noteheads.
                        // We need to find the specific notehead for this keyIndex.
                        // But for now, let's just color the whole chord if it's a chord?
                        // Or try to be specific.
                        
                        // Simplified: Color all paths in the group. 
                        // This colors the whole chord. 
                        // If we want individual note coloring, we need to inspect VexFlow internals more.
                        // Given the user request, highlighting the "note to play" (chord) is fine.
                        
                        const paths = group.querySelectorAll("path");
                        paths.forEach(p => {
                            p.setAttribute("fill", color);
                            p.setAttribute("stroke", color);
                        });
                    }
                }
            }

            // Internal function to move cursor (Deprecated/Hidden)
            function _moveCursor(x) {
                // Cursor is hidden via CSS
            }

            // Exposed for compatibility, but prefer updateCursor
            window.moveCursor = _moveCursor;
            
            // Animation Loop State
            let isPlaying = false;
            let lastServerTime = 0;
            let lastServerTimestamp = 0;
            let animationFrameId;
            let currentZoom = 1.0;
            let viewMode = 'paging'; // 'scrolling' or 'paging'

            window.visualEffectsEnabled = true;
            window.setVisualEffects = function(enabled) {
                window.visualEffectsEnabled = enabled;
                console.log("Visual effects set to:", enabled);
            }

            window.setViewMode = function(mode) {
                viewMode = mode;
                console.log("View mode set to:", mode);
                
                const container = document.getElementById("canvas-container");
                const output = document.getElementById("output");
                const wrapper = document.getElementById("score-wrapper");

                if (mode === 'wrapped') {
                    container.style.overflowX = "hidden";
                    container.style.overflowY = "auto";
                    
                    // A4 Style
                    output.style.width = "210mm"; 
                    output.style.margin = "0 auto";
                    output.style.backgroundColor = "white";
                    output.style.boxShadow = "0 0 10px rgba(0,0,0,0.1)";
                    output.style.minHeight = "100%";
                    
                    // Reset wrapper
                    wrapper.style.top = "0";
                    wrapper.style.transform = "none";
                    wrapper.style.display = "block";
                    wrapper.style.width = "100%";
                    wrapper.style.textAlign = "center";
                    
                } else {
                    container.style.overflowX = "auto";
                    container.style.overflowY = "hidden";
                    container.scrollTop = 0;
                    
                    // Reset to default
                    output.style.width = "auto";
                    output.style.margin = "0";
                    output.style.boxShadow = "none";
                    output.style.backgroundColor = "transparent";
                    
                    // Restore wrapper
                    wrapper.style.top = "50%";
                    wrapper.style.transform = "translateY(-50%)";
                    wrapper.style.display = "inline-block";
                    wrapper.style.width = "auto";
                    wrapper.style.textAlign = "left";
                }

                if (typeof render === 'function') render();
            }

            window.setZoom = function(zoom) {
                currentZoom = zoom;
                // For now, zoom only affects scroll calculation in paging/scrolling
                // To implement visual zoom, we would need to scale the SVG or container
            }

            window.play = function() {
                isPlaying = true;
                lastServerTimestamp = performance.now();
                cancelAnimationFrame(animationFrameId);
                loop();
            }

            window.pause = function() {
                isPlaying = false;
                cancelAnimationFrame(animationFrameId);
            }

            function updateScroll(pos) {
                const container = document.getElementById("canvas-container");
                
                if (viewMode === 'wrapped') {
                    // Vertical scrolling
                    const containerHeight = container.clientHeight;
                    // Center the current system vertically
                    // pos.y is the top of the system. We want it centered.
                    // System height is approx 200px.
                    const targetScroll = pos.y - (containerHeight / 2) + 100;
                    
                    // Smooth scroll "poco a poco"
                    const currentScroll = container.scrollTop;
                    const diff = targetScroll - currentScroll;
                    
                    // If difference is very large (e.g. seek/reset), jump immediately
                    if (Math.abs(diff) > 1000) {
                        container.scrollTop = targetScroll;
                    } else if (Math.abs(diff) > 1) {
                        // Smooth easing (5% per frame)
                        container.scrollTop = currentScroll + (diff * 0.05);
                    }
                } else if (viewMode === 'paging') {
                    const pageWidth = container.clientWidth;
                    const pageIndex = Math.floor((pos.x * currentZoom) / pageWidth);
                    const targetScroll = pageIndex * pageWidth;
                    if (Math.abs(container.scrollLeft - targetScroll) > 5) {
                        container.scrollLeft = targetScroll;
                    }
                    container.scrollTop = 0;
                } else {
                    // Scrolling
                    const halfWidth = container.clientWidth / 2;
                    const targetScroll = (pos.x * currentZoom) - halfWidth;
                    if (targetScroll >= 0) {
                        container.scrollLeft = targetScroll;
                    } else {
                        container.scrollLeft = 0;
                    }
                    container.scrollTop = 0;
                }
            }

            function loop() {
                if (!isPlaying) return;
                
                const now = performance.now();
                const deltaTime = (now - lastServerTimestamp) / 1000;
                const estimatedTime = lastServerTime + deltaTime;
                
                highlightActiveNotes(estimatedTime);
                
                const pos = calculatePositionForTime(estimatedTime);
                updateScroll(pos);
                
                animationFrameId = requestAnimationFrame(loop);
            }

            window.updateCursor = function(time) {
                lastServerTime = time;
                lastServerTimestamp = performance.now();
                
                if (!isPlaying) {
                    highlightActiveNotes(time);
                    const pos = calculatePositionForTime(time);
                    updateScroll(pos);
                }
            }
            
            function highlightActiveNotes(time) {
                let activeIndices = [];
                for(let i = 0; i < noteDataMap.length; i++) {
                    const noteData = noteDataMap[i];
                    const start = noteData.start_time;
                    const end = start + (noteData.duration_sec || 0.5);
                    
                    let newState = 'future';
                    if (time >= start && time < end) {
                        newState = 'active';
                        activeIndices.push(i);
                    } else if (time >= end) {
                        newState = 'past';
                    }
                    
                    if (noteData.currentState !== newState) {
                        noteData.currentState = newState;
                        if (newState === 'active') {
                            _applyColorToNote(i, activeNoteColor);
                        } else if (newState === 'past') {
                            _applyColorToNote(i, "#bdc3c7");
                        } else {
                            _applyColorToNote(i, noteData.baseColor);
                        }
                        _applyVisualEffect(i, newState);
                    }
                }
                activeNoteIndices = activeIndices;
                
                if (time < 0.1) {
                    document.getElementById("canvas-container").scrollLeft = 0;
                    document.getElementById("canvas-container").scrollTop = 0;
                }
            }
            
            function _applyVisualEffect(index, state) {
                if (!window.visualEffectsEnabled) return;
                
                if (indexToNoteMap[index]) {
                    const { note, keyIndex } = indexToNoteMap[index];
                    const group = note.getAttribute("el");
                    if (group) {
                        if (state === 'past') {
                            group.classList.add('smoke-effect');
                        } else {
                            group.classList.remove('smoke-effect');
                        }
                    }
                }
                
                // Check beams
                beamsList.forEach(beamData => {
                    // Check if this beam contains the updated note index
                    if (beamData.noteIndices.includes(index)) {
                        const allPast = beamData.noteIndices.every(idx => {
                            const n = noteDataMap[idx];
                            return n && n.currentState === 'past';
                        });
                        
                        const beamGroup = document.getElementsByClassName(beamData.className)[0];
                        if (beamGroup) {
                            if (allPast) {
                                beamGroup.classList.add('smoke-effect');
                                // Also ensure all child paths have the effect or inherit it
                                // Sometimes SVG groups don't propagate opacity/filter to children correctly in all browsers
                                // but usually they do.
                            } else {
                                beamGroup.classList.remove('smoke-effect');
                            }
                        } else {
                            // Fallback: try to find by ID if class failed (VexFlow quirk?)
                            // Or maybe the group wasn't created with class.
                            // Let's try to find the beam by inspecting the DOM if needed, but for now assume class works.
                            // console.warn("Beam group not found:", beamData.className);
                        }
                    }
                });
            }
            
            function calculatePositionForTime(time) {
                let prevNoteIndex = -1;
                let nextNoteIndex = -1;
                
                for(let i = 0; i < noteDataMap.length; i++) {
                    if (noteDataMap[i].start_time <= time) {
                        prevNoteIndex = i;
                    } else {
                        nextNoteIndex = i;
                        break;
                    }
                }
                
                let x = 10;
                let y = 0;
                
                const getPos = (noteObj) => {
                    if (!noteObj) return {x: 10, y: 0};
                    const note = noteObj.note;
                    let nx = 0;
                    try {
                        nx = note.getAbsoluteX();
                    } catch(e) {
                        console.warn("Error getting absolute X", e);
                    }
                    
                    let ny = 0;
                    try {
                        const stave = note.getStave();
                        if (stave) {
                            if (typeof stave.getY === 'function') {
                                ny = stave.getY();
                            } else if (stave.y !== undefined) {
                                ny = stave.y;
                            }
                        }
                    } catch(e) {
                        console.warn("Error getting stave Y", e);
                    }
                    return {x: nx, y: ny};
                };

                if (prevNoteIndex >= 0 && nextNoteIndex >= 0) {
                    const prevNoteObj = indexToNoteMap[prevNoteIndex];
                    const nextNoteObj = indexToNoteMap[nextNoteIndex];
                    
                    if (prevNoteObj && nextNoteObj) {
                        const p = getPos(prevNoteObj);
                        const n = getPos(nextNoteObj);
                        
                        if (Math.abs(p.y - n.y) > 50) {
                             x = p.x;
                             y = p.y;
                        } else {
                            const prevTime = noteDataMap[prevNoteIndex].start_time;
                            const nextTime = noteDataMap[nextNoteIndex].start_time;
                            if (nextTime > prevTime) {
                                const ratio = (time - prevTime) / (nextTime - prevTime);
                                x = p.x + (n.x - p.x) * ratio;
                                y = p.y;
                            } else {
                                x = p.x;
                                y = p.y;
                            }
                        }
                    }
                } else if (prevNoteIndex >= 0) {
                    const p = getPos(indexToNoteMap[prevNoteIndex]);
                    x = p.x;
                    y = p.y;
                } else if (nextNoteIndex >= 0) {
                    const n = getPos(indexToNoteMap[nextNoteIndex]);
                    x = n.x;
                    y = n.y;
                }
                return {x, y};
            }
            
            // Set Active Note Color
            let activeNoteColor = "#e67e22"; // Default Orange
            window.setActiveNoteColor = function(color) {
                activeNoteColor = color;
            }

            // Reset all notes to black (or base color)
            window.resetNotes = function() {
                noteDataMap.forEach((n, i) => {
                    n.baseColor = 'black'; // Reset base color
                    n.currentState = 'future'; // Reset state
                    _applyColorToNote(i, 'black');
                });
                activeNoteIndices = [];
                document.getElementById("canvas-container").scrollLeft = 0;
            }

            // Countdown function
            window.startCountdown = function(seconds) {
                const overlay = document.getElementById('countdown-overlay');
                overlay.style.display = 'flex';
                let count = Math.ceil(seconds);
                overlay.innerText = count;
                
                const interval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        overlay.innerText = count;
                    } else {
                        clearInterval(interval);
                        overlay.style.display = 'none';
                    }
                }, 1000);
            }

            // Initial render
            renderSample();
        });
    </script>
</body>
</html>
